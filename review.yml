aid: xano
name: Xano
review:
  question: Does Xano expose a documented public WebSocket / streaming API suitable for AsyncAPI modeling?
  answer: partial
  date: '2026-06-20'
  reviewer: API Evangelist
  asyncapiSpecCreated: false
  asyncapiScopeNote: |
    Xano DOES have a realtime feature powered by a WebSocket server (channels,
    presence, message history). However, the realtime surface is documented only
    through the @xano/js-sdk client (XanoClient instanceBaseUrl + realtimeCanonical).
    No raw WebSocket endpoint URL, wire protocol, message envelope schema, or
    non-SDK connection method is publicly documented. Because there is no
    documented protocol-level surface to model, no AsyncAPI document was authored.
    The HTTP Metadata API and generated user APIs are request/response REST and
    are modeled in openapi/xano-openapi.yml instead.
findings:
  summary: |
    Xano is a no-code backend-as-a-service. Its programmatic API surface has two
    distinct REST faces plus an SDK-only realtime layer:

    1. The Metadata API - a per-instance REST API served at
       https://{instance}.xano.io/api:meta with scoped Bearer access tokens. It
       manages workspace contents: tables, column schema, indexes, table records
       (content) with CRUD/bulk/search, files, branches, workspace export/import,
       and API groups/endpoints (including retrieving each group's auto-generated
       OpenAPI).
    2. The Generated User APIs - the REST APIs Xano users build visually. Each API
       group is served at its own /api:{token} path on the instance and
       auto-generates its own OpenAPI/Swagger; the surface is defined per workspace
       by the builder and is therefore not globally enumerable.
    3. Realtime (WebSockets) - a documented realtime channel feature, but exposed
       only via the @xano/js-sdk client with no published raw WebSocket URL or
       protocol, so it is not modeled as AsyncAPI.
  transports:
    - protocol: REST
      scheme: https
      baseURL: https://{instance}.xano.io/api:meta
      documented: true
      note: Metadata API. Per-instance host varies by account/region.
    - protocol: REST
      scheme: https
      baseURL: https://{instance}.xano.io/api:{api_group}
      documented: true
      note: Generated user-built API groups; per-workspace surface with its own generated OpenAPI.
    - protocol: WebSocket
      scheme: wss
      documented: partial
      note: >-
        Realtime channels exist and run over a WebSocket server, but connection is
        documented only through the @xano/js-sdk (instanceBaseUrl + realtimeCanonical).
        No raw WebSocket URL or wire protocol is published, so it cannot be modeled
        as AsyncAPI from documentation alone.
  endpointsConfirmedRest:
