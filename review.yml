sources:
  - url: https://docs.xano.com/xano-features/metadata-api
    type: Documentation
    note: Metadata API overview; base URL is the instance domain + /api:meta, Bearer access tokens.
  - url: https://docs.xano.com/xano-features/metadata-api/tables-and-schema
    type: APIReference
    note: Tables, schema, and index endpoints.
  - url: https://docs.xano.com/xano-features/metadata-api/content
    type: APIReference
    note: Table content (records) CRUD, bulk, and search endpoints.
  - url: https://docs.xano.com/connecting-to-a-front-end/fundamentals
    type: Documentation
    note: Generated user APIs served per group at /api:{token} with their own generated OpenAPI.
  - url: https://docs.xano.com/realtime/realtime-in-xano
    type: Documentation
    note: Realtime channels over WebSockets, but connection documented only via the @xano/js-sdk; no raw WebSocket URL/protocol published.
actions:
  asyncapiPath: null
  apisYmlUpdated: true
  reason: |
    The realtime WebSocket surface has no documented protocol-level interface
    (URL, message schema, channel bindings) outside the @xano/js-sdk, so no
    AsyncAPI document could be authored without speculation. The two REST faces
    (Metadata API and generated user APIs) are captured in apis.yml and the
    Metadata API is modeled in openapi/xano-openapi.yml.
