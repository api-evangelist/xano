specification: API Commons Plans
specificationVersion: '0.1'
schema: https://raw.githubusercontent.com/api-evangelist/interface-research/main/schema/api-commons.yml#/$defs/Plans
provider: Xano
providerId: xano
created: '2026-06-20'
modified: '2026-06-20'
reconciled: true
tags:
- No Code
- Backend as a Service
- BaaS
- API Builder
- Database
- Serverless
- Plans
description: >-
  Xano sells flat monthly subscription plans for its no-code backend platform
  rather than metering individual API calls. The Free plan rate-limits the
  generated REST APIs and caps records and storage; paid plans (Essential, Pro)
  remove the API rate limit and records cap, add dedicated infrastructure,
  branching, backups, more workspaces, team seats, and storage; the Custom plan
  adds self-hosting, multi-tenant, SSO, and negotiated terms. Pricing below
  reflects annual billing as published on the Xano pricing page.
notes: >-
  Prices and tier names change; verify against the Xano pricing page during
  reconciliation. Paid-plan prices shown are the annual-billing monthly rate;
  month-to-month billing is higher. The Metadata API is included on plans that
  permit programmatic access.
sources:
- https://www.xano.com/pricing/
- https://docs.xano.com/xano-features/metadata-api
plans:
- id: xano-free
  name: Free
  type: free
  description: >-
    No-cost plan with the visual API builder, generated REST APIs (rate
    limited), and unlimited serverless Lambda functions, capped on records,
    storage, and workspaces.
  entries:
  - label: Monthly Price
    name: free_price
    type: flat
    metric: subscription
    limit: -1
    timeFrame: month
    geo: global
    unit: 1
    price: $0
    userMultiplied: false
  - label: Generated API Rate Limit
    name: free_rate_limit
    type: limit
    metric: requests
    limit: 10
    timeFrame: 20s
    geo: global
    unit: 1
    price: included
    userMultiplied: false
  - label: Database Records
    name: free_records
    type: limit
    metric: records
    limit: 100000
    timeFrame: lifetime
    geo: global
    unit: 1
    price: included
    userMultiplied: false
  - label: Storage
    name: free_storage
    type: limit
    metric: gigabytes
    limit: 1
    timeFrame: lifetime
    geo: global
    unit: 1
    price: included (watermarked media)
    userMultiplied: false
  - label: Workspaces
    name: free_workspaces
    type: limit
    metric: workspaces
    limit: 1
    timeFrame: lifetime
    geo: global
    unit: 1
    price: included
    userMultiplied: false
  elements:
  - name: No-Code API Builder
  - name: Generated REST APIs (rate limited)
  - name: Unlimited Serverless Functions
