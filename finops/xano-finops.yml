meters:
- name: plan_subscription
  description: Flat monthly or annual subscription fee for the selected plan tier.
  unit: subscription
  aggregation: sum
  dimensions:
  - account
  - plan
- name: workspaces
  description: Workspaces consumed against the plan's included allowance.
  unit: workspaces
  aggregation: max
  dimensions:
  - account
  - plan
- name: team_seats
  description: Team member seats consumed against the plan's included allowance.
  unit: seats
  aggregation: max
  dimensions:
  - account
  - plan
- name: storage_gb
  description: Image and file storage consumed against the plan's included allowance.
  unit: gigabytes
  aggregation: max
  dimensions:
  - account
  - plan
- name: database_records
  description: Database records stored; capped on Free, unlimited on paid plans.
  unit: records
  aggregation: max
  dimensions:
  - account
  - workspace
- name: custom_addons
  description: Negotiated Custom-plan add-ons (self-hosting, multi-tenant, dedicated IP, SSO).
  unit: contract
  aggregation: sum
  dimensions:
  - account
principles:
- name: Visibility
  description: Track the active plan, seat count, workspace count, and storage against included allowances.
- name: Allocation
  description: Map workspaces and seats to teams/projects to attribute the flat subscription cost.
- name: Optimization
  description: Right-size the plan; consolidate workspaces; prune unused seats; stay within record/storage caps to avoid an upgrade.
- name: Accountability
  description: Assign a plan owner; review tier fit and renewal terms (annual vs monthly) before each billing cycle.
