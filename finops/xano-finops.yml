description: >-
  FinOps view of Xano spend. Xano bills as a flat monthly (or annual)
  subscription per plan (Free, Essential, Pro, Custom) rather than metering API
  calls. Cost drivers are the chosen plan tier, the number of workspaces and
  team seats, included storage and record caps, and any add-ons negotiated under
  a Custom agreement. There is no per-token or per-request usage charge on paid
  plans, so cost is predictable and managed by right-sizing the plan.
notes: >-
  Plan prices are subject to change; verify against the Xano pricing page during
  reconciliation. Overages on storage or seats and Custom add-ons are handled per
  contract.
sources:
- https://www.xano.com/pricing/
